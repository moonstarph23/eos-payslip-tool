[package]
name = "eos-payslip-tool"
version = "1.0.5"
description = "EOS Payslip Tool - Modern payroll processing application"
authors = ["EOS Global Expansion"]
license = ""
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5.0", features = [] }

[dependencies]
tauri = { version = "1.5.0", features = [ "updater", "window-minimize", "window-close", "window-start-dragging", "window-maximize", "window-unmaximize", "process-relaunch", "shell-sidecar", "path-all", "http-request", "shell-open", "dialog-open", "dialog-save", "fs-all", "os-all", "notification-all"] }
tauri-utils = { version = "1.5.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
